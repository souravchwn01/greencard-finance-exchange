services:

  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       exchange
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations run automatically on first startup (alphabetical order)
      - ./migrations/001_create_exchange_rates.sql:/docker-entrypoint-initdb.d/001_exchange_rates.sql:ro
      - ./migrations/002_create_quote_transactions.sql:/docker-entrypoint-initdb.d/002_quote_transactions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exchange"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ─── Go API ───────────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    env_file: .env              # picks up SUPABASE_*, INTERNAL_API_KEY, APP_* etc.
    environment:
      # Override local DSN / Redis with Docker service names
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/exchange?sslmode=disable
      REDIS_ADDR:   redis:6379
      REDIS_PASSWORD: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ─── Nginx + Frontend ─────────────────────────────────────────
  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
