server {
    listen 80;
    server_name _;

    # Allow up to 20 MB for evidence file uploads
    client_max_body_size 20M;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    # Static frontend
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy public API
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Proxy internal API (auth is enforced by the Go service itself)
    location /internal/ {
        proxy_pass         http://api:8080/internal/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Health & docs pass-through
    location /health {
        proxy_pass http://api:8080/health;
    }

    location /docs {
        proxy_pass http://api:8080/docs;
    }
}
